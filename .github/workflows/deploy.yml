name: Deploy

# Every push to main: checks → image in GHCR → rollout to nitpick.m3105.ru.
# Pull requests run the checks only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Image
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://nitpick.m3105.ru
    steps:
      - name: SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # The key is bound to /usr/local/bin/nitpick-deploy on the server
      # (see deploy/deploy.sh): it only accepts "deploy <sha>".
      - name: Roll out
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' |
            ssh -o BatchMode=yes "root@${{ secrets.DEPLOY_HOST }}" "deploy ${{ github.sha }}"

      - name: Check the site
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://nitpick.m3105.ru/api/health
          echo
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null \
            -w 'home: %{http_code}\n' https://nitpick.m3105.ru/
